<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container">
            <h1>Мой магазин</h1>
            <nav>
                <a href="{% url 'home' %}" class="text-white me-3">Главная</a>
                <a href="{% url 'contacts' %}" class="text-white">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <h1>Контакты</h1>
        <div class="row">
            <div class="col-md-6">
                <p>Вы можете связаться с нами по электронной почте: info@example.com</p>
                <p>Телефон: +7 (123) 456-78-90</p>
            </div>
            <div class="col-md-6">
                <!-- Дополнительное задание: форма обратной связи -->
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Ваше имя</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Сообщение</label>
                        <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
                {% if message_sent %}
                    <div class="alert alert-success mt-3">Спасибо! Ваше сообщение отправлено.</div>
                {% endif %}
            </div>
        </div>
    </main>

    <footer class="bg-light text-center py-3">
        <div class="container">
            <span class="text-muted">© 2025 Мой магазин</span>
        </div>
    </footer>
</body>
</html>
